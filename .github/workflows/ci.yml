name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze / Format / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check (package)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (package)
        run: flutter analyze

      - name: Test (package)
        run: flutter test

      - name: Install dependencies (example)
        working-directory: example
        run: flutter pub get

      - name: Format check (example)
        working-directory: example
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze (example)
        working-directory: example
        run: flutter analyze

      # 示例页的溢出矩阵（8 页 × 3 宽度 × 3 字号）必须真的跑，否则组件在窄屏 /
      # 大字号下的回归没人兜底。
      - name: Test (example)
        working-directory: example
        run: flutter test
